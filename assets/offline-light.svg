<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
<title id="title">Off the clock</title>
<desc id="desc">A sports coupe drives left to right, followed by a rolling weight plate, then a healthy meal and water bottle with a pulsing heart. The three scenes repeat.</desc>
<defs><clipPath id="lane"><rect x="1" y="48" width="998" height="110"/></clipPath></defs>
<style>
@keyframes drive{0%{transform:translateX(-240px);opacity:0}2%{opacity:1}30%{transform:translateX(1050px);opacity:1}32%,100%{transform:translateX(1050px);opacity:0}}
@keyframes roll{0%,33.32%{transform:translateX(-90px);opacity:0}33.333%{transform:translateX(-90px);opacity:0}35%{opacity:1}63.333%{transform:translateX(1050px);opacity:1}65%,100%{transform:translateX(1050px);opacity:0}}
@keyframes nourish{0%,66.65%{transform:translateX(-180px);opacity:0}66.667%{transform:translateX(-180px);opacity:0}68%{opacity:1}96.667%{transform:translateX(1050px);opacity:1}98%,100%{transform:translateX(1050px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%,100%{transform:scale(1)}35%{transform:scale(1.15)}}
.car{animation:drive 30s linear infinite;transform:translateX(-240px);opacity:0}
.plate{animation:roll 30s linear infinite;transform:translateX(-90px);opacity:0}
.nutrition{animation:nourish 30s linear infinite;transform:translateX(-180px);opacity:0}
.meal-bob{animation:bob 2.5s ease-in-out infinite}
.heart{animation:pulse 1.2s ease-in-out infinite;transform-origin:0 0}
.wheel{animation:spin .65s linear infinite;transform-origin:0 0}
.plate-spin{animation:spin 1.4s linear infinite;transform-origin:0 0}
@media(prefers-reduced-motion:reduce){.car{animation:none;transform:translateX(180px);opacity:1}.plate{animation:none;transform:translateX(480px);opacity:1}.nutrition{animation:none;transform:translateX(650px);opacity:1}.wheel,.plate-spin,.meal-bob,.heart{animation:none}}
</style>
<rect x="1" y="1" width="998" height="178" rx="14" fill="#ffffff" stroke="#d2dce3"/>
<text x="24" y="31" fill="#586b7a" font-family="Consolas,monospace" font-size="12" letter-spacing="2">OFF THE CLOCK</text>
<path d="M24 141 H976" stroke="#d2dce3" stroke-width="2"/>
<path d="M24 160 H976" stroke="#d2dce3" stroke-width="1.5" stroke-dasharray="24 24"/>
<g clip-path="url(#lane)">
  <g class="car">
    <ellipse cx="110" cy="137" rx="105" ry="4" fill="#d2dce3" opacity=".45"/>
    <path d="M10 112 L18 96 L55 90 L78 67 Q82 62 91 62 H134 Q144 62 151 69 L173 90 L207 98 Q216 101 216 111 V123 H10Z" fill="#087f72"/>
    <path d="M64 90 L85 69 H111 V90Z M116 69 H133 Q139 69 144 75 L160 90 H116Z" fill="#d8ecec" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M18 101 H201 M110 94 V114 M121 97 H130" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M11 117 H215" stroke="#172b3a" stroke-opacity=".35" stroke-width="3"/>
    <rect x="198" y="100" width="14" height="5" rx="2" fill="#172b3a"/>
    <rect x="16" y="99" width="6" height="7" rx="2" fill="#7950b3"/>
    <path d="M17 94 H43" stroke="#087f72" stroke-width="4"/>
    <g transform="translate(52 124)"><circle r="15" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
    <g class="wheel"><circle r="10" fill="#d2dce3"/><path d="M0-10V10 M-10 0H10 M-7-7L7 7 M-7 7L7-7" stroke="#586b7a" stroke-width="2"/><circle r="3" fill="#172b3a"/></g></g>
    <g transform="translate(172 124)"><circle r="15" fill="#ffffff" stroke="#172b3a" stroke-width="2.5"/>
    <g class="wheel"><circle r="10" fill="#d2dce3"/><path d="M0-10V10 M-10 0H10 M-7-7L7 7 M-7 7L7-7" stroke="#586b7a" stroke-width="2"/><circle r="3" fill="#172b3a"/></g></g>
  </g>
  <g class="plate">
    <ellipse cx="38" cy="139" rx="32" ry="4" fill="#d2dce3" opacity=".45"/>
    <g transform="translate(38 110)">
      <g class="plate-spin">
        <circle r="30" fill="#7950b3" stroke="#172b3a" stroke-width="1.5"/>
        <circle r="25" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.5"/>
        <g fill="#ffffff" stroke="#172b3a" stroke-opacity=".3" stroke-width="1">
          <rect x="-10" y="-23" width="20" height="6" rx="3"/>
          <rect x="-10" y="17" width="20" height="6" rx="3"/>
        </g>
        <circle r="8" fill="#172b3a"/>
        <circle r="4.5" fill="#ffffff"/>
        <g fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="700" text-anchor="middle">
          <text x="-18" y="3">45</text><text x="18" y="3">LB</text>
        </g>
      </g>
    </g>
  </g>
  <g class="nutrition">
    <ellipse cx="83" cy="139" rx="81" ry="4" fill="#d2dce3" opacity=".45"/>
    <g class="meal-bob">
      <path d="M15 98 Q8 83 24 80 Q22 63 40 72 Q50 60 63 73 Q80 60 82 80 Q96 73 103 91 L97 104Z" fill="#087f72"/>
      <path d="M25 88 Q40 76 53 90 M56 79 Q67 86 70 98 M77 89 Q89 84 94 96" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="2"/>
      <circle cx="41" cy="92" r="9" fill="#f28eae"/><circle cx="76" cy="88" r="8" fill="#f0be76"/>
      <path d="M8 101 H108 Q102 124 91 131 H25 Q14 122 8 101Z" fill="#d8ecec" stroke="#172b3a" stroke-width="2"/>
      <path d="M8 101 H108" stroke="#172b3a" stroke-width="4" stroke-linecap="round"/>
      <path d="M32 131 H84" stroke="#172b3a" stroke-width="3" stroke-linecap="round"/>
      <rect x="125" y="76" width="30" height="55" rx="9" fill="#d8ecec" stroke="#087f72" stroke-width="2"/>
      <path d="M126 106 Q133 100 140 105 Q148 110 154 104 V122 Q154 130 147 130 H133 Q126 130 126 122Z" fill="#087f72" opacity=".6"/>
      <rect x="132" y="65" width="16" height="12" rx="3" fill="#7950b3"/>
      <path d="M132 89 H146 M132 96 H146" stroke="#172b3a" stroke-opacity=".4" stroke-width="1.5"/>
      <g transform="translate(110 71)"><g class="heart"><path d="M0 5 C-19-5 -15-19 -6-17 Q0-16 0-11 Q0-16 6-17 C15-19 19-5 0 5Z" fill="#f28eae"/></g></g>
    </g>
  </g>
</g>
</svg>